# docker compose up -d --build
#
# Reads .env for its configuration. Nothing else is needed — no database, no broker, no volumes
# beyond a few kilobytes of state.

services:
  gather-bots:
    build: .
    image: gather-bots:local
    container_name: gather-bots
    restart: unless-stopped

    # env_file rather than `environment:` so secrets never appear in this file or in
    # `docker inspect` output as literals someone might paste into a ticket.
    #
    # required: false because a missing .env should produce this project's own "here is what to
    # configure" message, not a compose error about GetFileAttributesEx.
    env_file:
      - path: .env
        required: false

    # Overrides whatever .env says, because the path inside the container is not the host's.
    environment:
      STATE_FILE: /app/state/last-sent.json

    volumes:
      - state:/app/state

    # Only needed for the uptime webhook integration; harmless otherwise, since nothing listens
    # unless UPTIME_WEBHOOK_TOKEN is set.
    #
    # Bound to 127.0.0.1 so only a reverse proxy on this host can reach it. Drop the prefix to
    # expose it to your network — worth doing deliberately, not by accident.
    ports:
      - "127.0.0.1:${UPTIME_WEBHOOK_PORT:-8787}:${UPTIME_WEBHOOK_PORT:-8787}"

    # This is one HTTP poller. Capping it means a runaway loop or a memory leak stays a
    # contained annoyance rather than something that disturbs whatever else shares the host.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

    # A tick logs every POLL_INTERVAL_SECONDS. If the process is wedged the log goes quiet, and
    # unbounded logs on a long-lived container are their own kind of outage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

volumes:
  state:
